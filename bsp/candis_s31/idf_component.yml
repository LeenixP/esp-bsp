version: "1.0.0"
description: Board Support Package for Candis-S31
url: https://github.com/espressif/esp-bsp/tree/master/bsp/candis_s31

targets:
  - esp32s31

tags:
  - bsp

dependencies:
  idf: ">=6.1"

  espressif/tg28_sw:
    version: "^0.1.0"
    public: false
    override_path: "../../components/tg28_sw"

  esp_codec_dev:
    version: "~1.5"
    public: true

  espressif/esp_lvgl_port:
    version: "^2"
    public: true
    override_path: "../../components/esp_lvgl_port"

  espressif/esp_lcd_co5300:
    version: "^2.0.3"
    public: false

  kodediy/esp_lcd_touch_cst820:
    version: "^1.0.1"
    public: false

  esp_video:
    version: "~2.2"
    public: true

  led_indicator:
    version: "^2"
    public: true

  usb:
    version: "^1"
    public: true

examples:
  - path: ../../examples/display
  - path: ../../examples/display_camera_video
  - path: ../../examples/display_lvgl_demos
  - path: ../../examples/display_lvgl_benchmark
  - path: ../../examples/display_sdcard
  - path: ../../examples/display_usb_hid
